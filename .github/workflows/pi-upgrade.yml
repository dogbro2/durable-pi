name: pi-upgrade

# 每週一 09:00 UTC 自動檢查 pi 核心更新；也可以在 Actions 頁面手動觸發。
# 升級指令碼自帶回滾：構建 / 金標 / 打包校驗任一失敗都不會留下半升級狀態。
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 升級 pi 核心並校驗（失敗自動回滾）
        run: node scripts/upgrade-pi.mjs

      - name: 有變化就開 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "沒有可升級的版本"
            exit 0
          fi
          git config user.name "durable-pi-bot"
          git config user.email "bot@users.noreply.github.com"
          BRANCH="pi-upgrade/$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore: 升級 pi 核心（自動）"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: pi 核心自動升級" \
            --base main \
            --head "$BRANCH" \
            --body "由 \`pi-upgrade\` 工作流自動建立。升級指令碼已跑過 \`build:web\`、全部金標用例和 \`wrangler deploy --dry-run\`，全部通過才會開這個 PR。合併即自動部署。"
